[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookrecsys"
version = "0.1.0"
description = "Hybrid local-vector + online personalized book & web/light novel recommendation system with natural language search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ddgs>=7.0.0",
    "fastembed>=0.9.0",
    "httpx>=0.27.0",
    "numpy>=2.0.0",
    "openpyxl>=3.1.5",
    "pyarrow>=18.0.0",
    "python-dotenv>=1.0.1",
    "rapidfuzz>=3.10.0",
    "rich>=13.9.0",
    "tqdm>=4.66.0",
    "typer>=0.15.0",
]

[project.scripts]
bookrecsys = "bookrecsys.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bookrecsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
link-mode = "copy"
